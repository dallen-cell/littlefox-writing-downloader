[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "littlefox-writing-downloader"
version = "0.1.0"
description = "Offline foundation for exporting synthetic Little Fox Writing records"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
dependencies = [
    "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
test = ["tzdata>=2024.1"]
probe = ["playwright>=1.48,<2"]

[project.scripts]
littlefox-writing = "littlefox_writing.cli:main"
littlefox-one-record-probe = "littlefox_writing.one_record_probe:main"

[tool.setuptools.packages.find]
where = ["src"]

